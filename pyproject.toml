[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-login"
version = "0.1.0"
description = "Manage Codex logins on macOS"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
codex-login = "codex_login:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_login.py"]
